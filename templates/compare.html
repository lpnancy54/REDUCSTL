<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparaison STL - Original vs Réduit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .container {
            display: flex;
            height: calc(100vh - 70px);
        }

        .viewer-panel {
            flex: 1;
            position: relative;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .viewer-panel:last-child {
            border-right: none;
        }

        .panel-header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .panel-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-title.original {
            color: #ff6b6b;
        }

        .panel-title.reduced {
            color: #00c853;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
        }

        .stat-label {
            color: #888;
        }

        .stat-value {
            font-weight: bold;
        }

        .stat-value.highlight {
            color: #00c853;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .controls-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #888;
            text-align: center;
        }

        .sync-toggle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }

        .sync-toggle:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .wireframe-toggle {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .wireframe-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Comparaison 3D : Original vs Réduit</h1>
        <a href="/" class="btn btn-back">Retour</a>
    </div>

    <button class="sync-toggle" id="syncToggle" title="Synchroniser les vues">Sync ON</button>

    <div class="container">
        <div class="viewer-panel" id="leftPanel">
            <div class="panel-header">
                <div class="panel-title original">
                    <span>ORIGINAL</span>
                </div>
                <div class="stats" id="statsOriginal">
                    <div class="stat-item">
                        <span class="stat-label">Triangles:</span>
                        <span class="stat-value" id="triOriginal">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Vertices:</span>
                        <span class="stat-value" id="vertOriginal">-</span>
                    </div>
                </div>
            </div>
            <div class="loading" id="loadingLeft">
                <div class="spinner"></div>
                <div>Chargement du modèle...</div>
            </div>
            <button class="wireframe-toggle" onclick="toggleWireframe('left')">Wireframe</button>
        </div>

        <div class="viewer-panel" id="rightPanel">
            <div class="panel-header">
                <div class="panel-title reduced">
                    <span>RÉDUIT</span>
                </div>
                <div class="stats" id="statsReduit">
                    <div class="stat-item">
                        <span class="stat-label">Triangles:</span>
                        <span class="stat-value highlight" id="triReduit">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Vertices:</span>
                        <span class="stat-value highlight" id="vertReduit">-</span>
                    </div>
                </div>
            </div>
            <div class="loading" id="loadingRight">
                <div class="spinner"></div>
                <div>Chargement du modèle...</div>
            </div>
            <button class="wireframe-toggle" onclick="toggleWireframe('right')">Wireframe</button>
        </div>
    </div>

    <div class="controls-info">
        Clic gauche + glisser = Rotation | Molette = Zoom | Clic droit + glisser = Pan
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const sessionId = "{{ session_id }}";
        const originalFile = "{{ original }}";
        const reduitFile = "{{ reduit }}";

        let sceneLeft, sceneRight;
        let cameraLeft, cameraRight;
        let rendererLeft, rendererRight;
        let controlsLeft, controlsRight;
        let meshLeft, meshRight;
        let syncEnabled = true;

        // Initialisation
        function init() {
            initViewer('left', document.getElementById('leftPanel'));
            initViewer('right', document.getElementById('rightPanel'));

            loadSTL(`/view/${sessionId}/${originalFile}`, 'left', 0xff6b6b);
            loadSTL(`/view/${sessionId}/${reduitFile}`, 'right', 0x00c853);

            // Sync toggle
            document.getElementById('syncToggle').addEventListener('click', () => {
                syncEnabled = !syncEnabled;
                document.getElementById('syncToggle').textContent = syncEnabled ? 'Sync ON' : 'Sync OFF';
            });

            animate();
        }

        function initViewer(side, container) {
            const width = container.clientWidth;
            const height = container.clientHeight;

            // Scene
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);

            // Camera
            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(0, 0, 100);

            // Renderer
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Controls
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lights
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight1.position.set(1, 1, 1);
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight2.position.set(-1, -1, -1);
            scene.add(directionalLight2);

            // Grid helper
            const gridHelper = new THREE.GridHelper(100, 20, 0x444444, 0x333333);
            gridHelper.rotation.x = Math.PI / 2;
            scene.add(gridHelper);

            if (side === 'left') {
                sceneLeft = scene;
                cameraLeft = camera;
                rendererLeft = renderer;
                controlsLeft = controls;
            } else {
                sceneRight = scene;
                cameraRight = camera;
                rendererRight = renderer;
                controlsRight = controls;
            }
        }

        function loadSTL(url, side, color) {
            const loader = new THREE.STLLoader();
            loader.load(url, (geometry) => {
                geometry.computeVertexNormals();
                geometry.center();

                const material = new THREE.MeshPhongMaterial({
                    color: color,
                    specular: 0x111111,
                    shininess: 50,
                    flatShading: false
                });

                const mesh = new THREE.Mesh(geometry, material);

                // Scale to fit view
                const box = new THREE.Box3().setFromObject(mesh);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 50 / maxDim;
                mesh.scale.set(scale, scale, scale);

                if (side === 'left') {
                    sceneLeft.add(mesh);
                    meshLeft = mesh;
                    document.getElementById('loadingLeft').style.display = 'none';
                    document.getElementById('triOriginal').textContent = (geometry.attributes.position.count / 3).toLocaleString();
                    document.getElementById('vertOriginal').textContent = geometry.attributes.position.count.toLocaleString();
                } else {
                    sceneRight.add(mesh);
                    meshRight = mesh;
                    document.getElementById('loadingRight').style.display = 'none';
                    document.getElementById('triReduit').textContent = (geometry.attributes.position.count / 3).toLocaleString();
                    document.getElementById('vertReduit').textContent = geometry.attributes.position.count.toLocaleString();
                }
            });
        }

        function toggleWireframe(side) {
            const mesh = side === 'left' ? meshLeft : meshRight;
            if (mesh) {
                mesh.material.wireframe = !mesh.material.wireframe;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            controlsLeft.update();
            controlsRight.update();

            // Sync cameras if enabled
            if (syncEnabled) {
                cameraRight.position.copy(cameraLeft.position);
                cameraRight.rotation.copy(cameraLeft.rotation);
                controlsRight.target.copy(controlsLeft.target);
            }

            rendererLeft.render(sceneLeft, cameraLeft);
            rendererRight.render(sceneRight, cameraRight);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            const leftPanel = document.getElementById('leftPanel');
            const rightPanel = document.getElementById('rightPanel');

            cameraLeft.aspect = leftPanel.clientWidth / leftPanel.clientHeight;
            cameraLeft.updateProjectionMatrix();
            rendererLeft.setSize(leftPanel.clientWidth, leftPanel.clientHeight);

            cameraRight.aspect = rightPanel.clientWidth / rightPanel.clientHeight;
            cameraRight.updateProjectionMatrix();
            rendererRight.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
        });

        // Cleanup on page leave
        window.addEventListener('beforeunload', () => {
            fetch(`/cleanup/${sessionId}`);
        });

        init();
    </script>
</body>
</html>
