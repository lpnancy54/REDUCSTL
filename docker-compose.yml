version: '3.8'

services:
  stl-reducer:
    build: .
    container_name: stl-reducer-saas
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service optionnel pour le nettoyage automatique des fichiers
  cleanup:
    build: .
    container_name: stl-reducer-cleanup
    command: >
      sh -c "while true; do
        find /app/uploads -type d -mmin +1440 -exec rm -rf {} + 2>/dev/null || true;
        sleep 3600;
      done"
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
